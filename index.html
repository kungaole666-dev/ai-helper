<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 智能助手 · Gemini 驱动</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked Markdown 解析 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- KaTeX 数学公式渲染 (解题神器) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <!-- 引入图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .message-content p { margin-bottom: 0.5rem; }
        .message-content p:last-child { margin-bottom: 0; }
        .katex-display { margin: 0.5em 0; overflow-x: auto; overflow-y: hidden; }
        pre code { display: block; padding: 0.5rem; background: #2d3748; color: #f7fafc; border-radius: 0.375rem; overflow-x: auto; font-size: 0.875rem; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-between overflow-hidden">

    <!-- 顶部导航栏 -->
    <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                <i class="fa-solid fa-sparkles text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-gray-800 text-base leading-tight">AI 智能助手</h1>
                <p class="text-xs text-gray-500 flex items-center">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block mr-1"></span>
                    Gemini 3.8 Flash · 解题与记事
                </p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- 官方免费模型专属选择器 -->
            <select id="model-select" onchange="onModelChange()" class="text-xs bg-gray-50 border border-gray-200 text-gray-700 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-emerald-500 font-medium cursor-pointer">
                <option value="gemini-3.8-flash" selected>🔥 Gemini 3.8 Flash (最新主力 · 免费)</option>
                <option value="gemini-3.5-flash-lite">⚡ Gemini 3.5 Flash Lite (极速响应 · 免费)</option>
                <option value="gemini-3.1-pro-preview">🧠 Gemini 3.1 Pro (深度推理 · 免费)</option>
                <option value="gemini-3.1-flash-lite">🚀 Gemini 3.1 Flash Lite (稳定 · 免费)</option>
            </select>
            <button onclick="toggleNotesDrawer()" class="px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 transition flex items-center space-x-1">
                <i class="fa-regular fa-clipboard"></i>
                <span class="hidden sm:inline">我的</span><span>备忘</span>
            </button>
        </div>
    </header>

    <!-- 聊天消息展示区域 -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- 欢迎卡片 -->
        <div class="flex justify-start">
            <div class="max-w-[88%] bg-white p-3.5 rounded-2xl rounded-tl-sm shadow-sm border border-gray-100 text-gray-800 text-sm leading-relaxed">
                <p class="font-semibold text-emerald-600 mb-1">👋 你好！我是你的专属 AI 助理</p>
                <p class="text-gray-600 mb-2">我支持多用户数据隔离，你可以直接告诉我：</p>
                <ul class="text-xs text-gray-500 space-y-1 list-disc list-inside">
                    <li><strong class="text-gray-700">📐 解题辅导</strong>：直接发数学/物理题，给出分步演算与公式推导</li>
                    <li><strong class="text-gray-700">📝 记事提醒</strong>：发送“记一下：明天下午开会”自动存入清单</li>
                    <li><strong class="text-gray-700">🔍 联网检索</strong>：发送“搜一下：xxx”获取最新信息</li>
                </ul>
            </div>
        </div>
    </main>

    <!-- 底部输入区域 -->
    <footer class="bg-white border-t border-gray-200 p-3 z-10">
        <!-- 快捷功能标签 -->
        <div class="flex space-x-2 mb-2 overflow-x-auto pb-1 text-xs">
            <button onclick="quickFill('解方程：2x^2 - 4x - 6 = 0，求根并给出推导过程')" class="px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 whitespace-nowrap hover:bg-gray-200">
                📐 解二次方程
            </button>
            <button onclick="quickFill('记一下：明天上午交数学作业')" class="px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 whitespace-nowrap hover:bg-gray-200">
                📝 记待办
            </button>
            <button onclick="quickFill('我的备忘')" class="px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 whitespace-nowrap hover:bg-gray-200">
                📋 查备忘录
            </button>
        </div>

        <div class="flex items-end space-x-2">
            <textarea id="user-input" rows="1" placeholder="发消息，问数学题或记备忘..." 
                class="flex-1 max-h-32 p-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white resize-none"
                onkeydown="handleKey(event)"></textarea>
            <button id="send-btn" onclick="sendMessage()" class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center hover:bg-emerald-700 active:scale-95 transition shadow-sm">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>
        <div class="text-[10px] text-gray-400 text-center mt-1.5 flex justify-between px-1">
            <span>用户标识: <strong id="user-tag" class="text-gray-500">加载中</strong></span>
            <span>按 Enter 发送</span>
        </div>
    </footer>

    <!-- 备忘录抽屉 (Drawer) -->
    <div id="notes-drawer" class="fixed inset-0 bg-black/40 z-50 hidden flex justify-end">
        <div class="w-full max-w-sm bg-white h-full shadow-2xl flex flex-col p-4">
            <div class="flex items-center justify-between pb-3 border-b border-gray-100">
                <h2 class="font-bold text-gray-800 text-base flex items-center">
                    <i class="fa-solid fa-book-bookmark text-emerald-600 mr-2"></i>
                    我的个人备忘录
                </h2>
                <button onclick="toggleNotesDrawer()" class="text-gray-400 hover:text-gray-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div id="notes-list" class="flex-1 overflow-y-auto py-3 space-y-2.5">
                <p class="text-xs text-gray-400 text-center py-8">正在加载备忘列表...</p>
            </div>

            <div class="pt-3 border-t border-gray-100 text-center text-xs text-gray-400">
                提示：发送“记一下：xxx”即可添加
            </div>
        </div>
    </div>

    <script>
        // 初始化多用户 ID
        let userId = localStorage.getItem("wechat_agent_user_id");
        if (!userId) {
            userId = "user_" + Math.random().toString(36).substring(2, 10);
            localStorage.setItem("wechat_agent_user_id", userId);
        }
        document.getElementById("user-tag").innerText = userId;

        // 模型选择记忆
        const savedModel = localStorage.getItem("wechat_agent_model");
        if (savedModel && document.getElementById("model-select")) {
            document.getElementById("model-select").value = savedModel;
        }
        function onModelChange() {
            localStorage.setItem("wechat_agent_model", document.getElementById("model-select").value);
        }

        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function quickFill(text) {
            userInput.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. 渲染用户气泡
            appendMessage("user", text);
            userInput.value = "";
            userInput.style.height = 'auto';

            // 2. 渲染正在思考占位符
            const loadingId = appendLoading();
            sendBtn.disabled = true;

            try {
                const selectedModel = document.getElementById("model-select") ? document.getElementById("model-select").value : "";
                const resp = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: userId, message: text, model: selectedModel })
                });
                const data = await resp.json();
                
                // 移除 loading
                document.getElementById(loadingId)?.remove();

                if (data.reply) {
                    appendMessage("assistant", data.reply);
                } else {
                    appendMessage("assistant", "⚠️ 处理请求出现异常，请稍后再试。");
                }
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                appendMessage("assistant", "❌ 网络连接失败: " + err.message);
            } finally {
                sendBtn.disabled = false;
            }
        }

        function appendMessage(role, text) {
            const msgDiv = document.createElement("div");
            msgDiv.className = role === "user" ? "flex justify-end" : "flex justify-start";

            const bubble = document.createElement("div");
            if (role === "user") {
                bubble.className = "max-w-[85%] bg-emerald-600 text-white p-3 rounded-2xl rounded-tr-sm text-sm shadow-sm whitespace-pre-wrap leading-relaxed";
                bubble.innerText = text;
            } else {
                bubble.className = "max-w-[90%] bg-white text-gray-800 p-3.5 rounded-2xl rounded-tl-sm text-sm shadow-sm border border-gray-100 leading-relaxed message-content";
                bubble.innerHTML = marked.parse(text);
                // 渲染公式
                renderMathInElement(bubble, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\[', right: '\\]', display: true},
                        {left: '\\(', right: '\\)', display: false}
                    ],
                    throwOnError: false
                });
            }

            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendLoading() {
            const id = "loading-" + Date.now();
            const div = document.createElement("div");
            div.id = id;
            div.className = "flex justify-start";
            div.innerHTML = `
                <div class="bg-white p-3 rounded-2xl rounded-tl-sm shadow-sm border border-gray-100 flex items-center space-x-1.5 text-gray-400 text-xs">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-bounce"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-bounce" style="animation-delay: 0.2s"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-bounce" style="animation-delay: 0.4s"></span>
                    <span class="ml-1 text-gray-500">Gemini 正在深度推导演算...</span>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        async function toggleNotesDrawer() {
            const drawer = document.getElementById("notes-drawer");
            if (drawer.classList.contains("hidden")) {
                drawer.classList.remove("hidden");
                await loadNotes();
            } else {
                drawer.classList.add("hidden");
            }
        }

        async function loadNotes() {
            const listEl = document.getElementById("notes-list");
            listEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-8">正在刷新...</p>';
            try {
                const res = await fetch(`/api/notes?user_id=${userId}`);
                const data = await res.json();
                if (!data.notes || data.notes.length === 0) {
                    listEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-8">你还没有任何备忘或待办哦</p>';
                    return;
                }
                listEl.innerHTML = "";
                data.notes.forEach(n => {
                    const item = document.createElement("div");
                    item.className = "bg-gray-50 p-2.5 rounded-xl border border-gray-200/60 flex items-start justify-between text-xs";
                    item.innerHTML = `
                        <div class="flex-1 pr-2">
                            <span class="inline-block px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-medium text-[10px] mb-1">${n.category}</span>
                            <p class="text-gray-800 font-medium text-sm">${n.content}</p>
                            <span class="text-[10px] text-gray-400">${n.created_at}</span>
                        </div>
                        <button onclick="deleteNote(${n.id})" class="text-gray-300 hover:text-red-500 transition p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    `;
                    listEl.appendChild(item);
                });
            } catch(e) {
                listEl.innerHTML = `<p class="text-xs text-red-400 text-center py-8">加载失败: ${e.message}</p>`;
            }
        }

        async function deleteNote(id) {
            await fetch(`/api/notes/delete?user_id=${userId}&note_id=${id}`, { method: "POST" });
            loadNotes();
        }
    </script>
</body>
</html>
